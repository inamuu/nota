[tools]
rust = "latest"

[env]
# Acta のデータディレクトリ。既定は ~/Documents/Acta
# NOTA_DATA_DIR = "{{env.HOME}}/Documents/Acta"

[tasks.build]
description = "リリースビルドして /usr/local/bin に配置"
# /usr/local/bin は root 所有のことが多い。書けるならそのまま、
# 書けなければ sudo に切り替える。install は権限も同時に設定する。
run = """
set -e
cargo build --release
dest=/usr/local/bin/nota
if [ -w /usr/local/bin ]; then
  install -m 755 target/release/nota "$dest"
else
  echo "$dest へ配置するため sudo を使います"
  sudo install -m 755 target/release/nota "$dest"
fi
echo "配置しました: $dest ($("$dest" --version))"
"""

[tasks.check]
description = "デバッグビルド（コンパイル確認）"
run = "cargo build"

[tasks.release]
description = "リリースビルドのみ（配置しない）"
run = "cargo build --release"

[tasks.run]
description = "TUI を起動"
run = "cargo run"

[tasks.test]
description = "テスト実行"
run = "cargo test"

[tasks.lint]
description = "clippy と fmt チェック"
run = ["cargo clippy --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.fmt]
description = "フォーマット適用"
run = "cargo fmt"
