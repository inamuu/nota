[package]
name = "nota"
version = "0.1.0"
edition = "2021"
description = "Acta のデータをターミナルから読むための TUI"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
